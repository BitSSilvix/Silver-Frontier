<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silver Fr0ntier</title>
  <!-- Подключаем наш мощный CSS -->
  <link rel="stylesheet" href="styles.css">
  <!-- Подключаем JS -->
  <script src="main.js" defer></script>
</head>
<body>
  <div class="browser-container">
    <!-- Кастомный Тайтлбар (верхняя панель) -->
    <header class="titlebar" data-tauri-drag-region>
      <h1 class="app-title">Frontier</h1>
      <!-- Центральная адресная строка -->
      <div class="omnibox">
        <input type="text" id="url-input" placeholder="Введите адрес или запрос в Google..." value="google.com" autocomplete="off" />
        <button id="btn-go">GO</button>
      </div>
      <!-- Кнопки управления окном (справа) -->
      <div class="window-controls">
        <button id="win-min">−</button>
        <button id="win-max">◻</button>
        <button id="win-close">✕</button>
      </div>
    </header>

    <div class="workspace">
      <!-- Боковая панель (задел под вертикальные вкладки) -->
      <aside id="sidebar">
        <button id="btn-home" class="sidebar-btn active" title="SURFACE">❖</button>
      </aside>
      <main id="viewport-anchor">
        <section id="surface-screen" class="surface-active">
          <div class="surface-hero">
            <span class="surface-badge">ASO ENGINE v0.15</span>
            <h2 id="surface-appname" class="surface-appname">Frontier</h2>
            <h2 id="surface-mversion" class="surface-mversion">pre-Aso</h2>
            <p class="surface-greeting">Greetings to Frontier!</p>
          </div>

          <div class="surface-search-box">
            <input type="text" id="surface-input" placeholder="Поиск..." autocomplete="off" />
            <button id="surface-btn-go">GO</button>
          </div>

        </section>
      </main>
    </div>
  </div>
</body>
</html>
